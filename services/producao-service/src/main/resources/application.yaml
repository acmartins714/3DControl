server:
  port: ${SERVER_PORT:8084}

spring:
  # Falha rápido quando um serviço dependente cai (evita requisições presas no timeout do SO)
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  application:
    name: producao-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:producao_db}
    username: ${DB_USER:threedcontrol}
    password: ${DB_PASSWORD:threedcontrol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

integracao:
  pedido-url: ${PEDIDO_URL:http://localhost:8082}
