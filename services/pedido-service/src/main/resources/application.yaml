server:
  port: ${SERVER_PORT:8082}

spring:
  # Falha rápido quando um serviço dependente cai (evita requisições presas no timeout do SO)
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  application:
    name: pedido-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedido_db}
    username: ${DB_USER:threedcontrol}
    password: ${DB_PASSWORD:threedcontrol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

integracao:
  cadastro-url: ${CADASTRO_URL:http://localhost:8081}
  estoque-url: ${ESTOQUE_URL:http://localhost:8083}
  producao-url: ${PRODUCAO_URL:http://localhost:8084}
  financeiro-url: ${FINANCEIRO_URL:http://localhost:8085}
